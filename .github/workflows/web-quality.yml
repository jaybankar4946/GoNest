name: Web quality checks

on:
  push:
    branches: [main]
    paths:
      - "apps/web/**"
      - ".github/workflows/web-quality.yml"
  pull_request:
    paths:
      - "apps/web/**"
      - ".github/workflows/web-quality.yml"

permissions:
  contents: read

concurrency:
  group: web-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    name: TypeScript typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package.json

      # No package lock is currently committed. npm install is used until a
      # reviewed lockfile is added; this check is not yet a reproducible build.
      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck
